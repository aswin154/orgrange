<div class="w-1/2 md:w-1/3 xl:w-1/4 p-6">
    <a href="{{ product.get_url }}">
        <img class="rounded-xl hover:shadow-lg max-h-[130px]" alt="{{ product.name }}" src="{% if product.image %}{{ product.image.url }}{% endif %}">
    </a>
    <div class="pt-3 flex items-center justify-between">
        <a href="{{ product.get_url }}">{{ product.name }}</a>
    </div>
    <P CLASS="PT-1 TEXT-GRAY-400">&#8377 {{ product.price }}
<!--     <P CLASS="PT-1 TEXT-GRAY-400">{{ product.description|truncatewords:10 }} -->
    </p>
</div>
